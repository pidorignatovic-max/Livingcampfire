name: Build Living Campfires

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Build mod
        run: gradle build --no-daemon

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LivingCampfires
          path: build/libs/*.jar
